"$schema" = "https://www.schemastore.org/bunfig.json"

[run]
bun = true
noOrphans = true

[install]
auto = "disable"
linker = "isolated"
hoistPattern = ["@csstools/*", "ekscss", "postcss*"] # no phantom dependencies
peer = false
minimumReleaseAge = 604800 # 7 days
minimumReleaseAgeExcludes = ["@maxmilton/*", "bugbox", "stage1"]

[test]
preload = ["./test/setup.ts"]
